spring.application.name=order-service
server.port=8081
inventory.service.url=http://localhost:8082

spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=tradeflow
spring.datasource.password=tradeflow_dev

#spring.datasource.username=${ORDER_DB_USER}
#spring.datasource.password=${ORDER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=15000